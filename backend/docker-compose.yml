# Local development dependencies. Not a production deployment.
#
# Versions are pinned to majors rather than left at `latest`, so a rebuild
# months from now does not silently move Postgres underneath the data.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Migrations run as soon as the container is up; without this they race
      # the database's own startup and fail on a cold machine.
      test: ['CMD-SHELL', 'pg_isready -U jobmatch -d jobmatch']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
