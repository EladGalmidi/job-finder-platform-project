# Local development dependencies. Not a production deployment.
#
# Versions are pinned to majors rather than left at `latest`, so a rebuild
# months from now does not silently move Postgres underneath the data.

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobmatch
      POSTGRES_PASSWORD: jobmatch
      POSTGRES_DB: jobmatch
    ports:
      # 5433 on the host, not 5432.
      #
      # A natively installed PostgreSQL already listens on 5432 on this machine.
      # Windows lets Docker's proxy bind the same port without error, and the
      # native server then answers the connections — so the container looks
      # healthy while every query goes somewhere else entirely. Publishing on a
      # free port removes the ambiguity and leaves the existing install alone.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Migrations run as soon as the container is up; without this they race
      # the database's own startup and fail on a cold machine.
      test: ['CMD-SHELL', 'pg_isready -U jobmatch -d jobmatch']
      interval: 5s
      timeout: 5s
      retries: 10

# Redis is deliberately absent.
#
# It was here for a job queue, and the analysis job ended up running in the
# server process instead, so nothing ever connected to it. Bring it back when
# there is a real reason: analysis work that must survive a restart, or a slow
# OCR run that must not occupy a request handler.

volumes:
  postgres-data:
